[project]
name = "telco-customer-intelligence"
version = "0.1.0"
description = "Synthetic, causal, reproducible telco customer-intelligence data model + the analytics cases it feeds"
requires-python = ">=3.10"
# The data model itself is standard-library only — deliberately, so it stays
# auditable and CI can validate it without installing anything. The individual
# case notebooks (churn, NBO, ...) will declare their own heavier deps
# (pandas/scikit-learn) as they are added.

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# An active track, so a real style bar (not just the monorepo correctness floor).
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled pragmatically
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Tests import the package after a sys.path insert, so imports are not at top.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
