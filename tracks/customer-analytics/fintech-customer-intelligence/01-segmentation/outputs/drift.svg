  <text x="320.0" y="119.0" text-anchor="end" font-size="11" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">… because their risk band moved</text>
  <text x="586.6" y="119.0" text-anchor="start" font-size="11" font-weight="bold" font-family="ui-sans-serif,system-ui,sans-serif" fill="#e45756">41.3%</text>
  <rect x="330" y="144.0" width="36.6" height="20" fill="#9a6fb0" fill-opacity="0.80"/>
