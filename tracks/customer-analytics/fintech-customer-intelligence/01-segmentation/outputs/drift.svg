<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 298" width="720" height="298" role="img" aria-label="Segment migration between the two observation cutoffs">
  <text x="18.0" y="20.0" text-anchor="start" font-size="13" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">Six months later: the report is stable, the customers are not</text>
  <text x="18.0" y="36.0" text-anchor="start" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">same rule applied at both cutoffs, 3,439 customers present in both (cross-fitted)</text>
