  <text x="450.4" y="284.0" text-anchor="middle" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">20%</text>
  <line x1="570.8" y1="58.0" x2="570.8" y2="270.0" stroke="#8b949e" stroke-opacity="0.18" stroke-width="1"/>
