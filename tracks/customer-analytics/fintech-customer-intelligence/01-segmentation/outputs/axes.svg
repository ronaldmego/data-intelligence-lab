<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="Variation and separation of each RFM dimension">
  <text x="18.0" y="20.0" text-anchor="start" font-size="13" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">What each dimension is worth in a subscription</text>
  <text x="340.0" y="56.0" text-anchor="middle" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">share of the base on one value</text>
  <text x="578.0" y="56.0" text-anchor="middle" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">churn gap, top vs bottom fifth</text>
  <text x="18.0" y="88.0" text-anchor="start" font-size="11" font-weight="bold" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">R · recency</text>
  <text x="18.0" y="102.0" text-anchor="start" font-size="9" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e" fill-opacity="0.85">months since their last invoice</text>
  <rect x="250" y="78.0" width="180.0" height="16" fill="#e45756" fill-opacity="0.32"/>
  <text x="424.0" y="91.0" text-anchor="end" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#e45756">100%</text>
  <text x="242.0" y="91.0" text-anchor="end" font-size="9" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">1 distinct</text>
  <line x1="496.0" y1="86.0" x2="504.0" y2="86.0" stroke="#e45756" stroke-width="2.5"/>
  <text x="512.0" y="90.0" text-anchor="start" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#e45756">no variation to read</text>
  <text x="18.0" y="132.0" text-anchor="start" font-size="11" font-weight="bold" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">F · frequency</text>
  <text x="18.0" y="146.0" text-anchor="start" font-size="9" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e" fill-opacity="0.85">invoices issued to them</text>
  <rect x="250" y="122.0" width="127.6" height="16" fill="#4c78a8" fill-opacity="0.32"/>
  <text x="383.6" y="135.0" text-anchor="start" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#4c78a8">71%</text>
  <text x="242.0" y="135.0" text-anchor="end" font-size="9" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">23 distinct</text>
  <circle cx="531.7" cy="130.0" r="5.5" fill="#4c78a8"/>
  <text x="541.7" y="134.0" text-anchor="start" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">1.8%</text>
  <text x="18.0" y="176.0" text-anchor="start" font-size="11" font-weight="bold" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">M · monetary</text>
  <text x="18.0" y="190.0" text-anchor="start" font-size="9" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e" fill-opacity="0.85">average amount billed</text>
  <rect x="250" y="166.0" width="1.0" height="16" fill="#4c78a8" fill-opacity="0.32"/>
  <text x="256.2" y="179.0" text-anchor="start" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#4c78a8">&lt;1%</text>
  <text x="242.0" y="179.0" text-anchor="end" font-size="9" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">4,178 distinct</text>
  <circle cx="539.6" cy="174.0" r="5.5" fill="#4c78a8"/>
  <text x="549.6" y="178.0" text-anchor="start" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">2.3%</text>
  <text x="18.0" y="220.0" text-anchor="start" font-size="11" font-weight="bold" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">R* · engagement recency</text>
  <text x="18.0" y="234.0" text-anchor="start" font-size="9" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e" fill-opacity="0.85">months since they opened the app</text>
  <rect x="250" y="210.0" width="146.4" height="16" fill="#4c78a8" fill-opacity="0.32"/>
  <text x="402.4" y="223.0" text-anchor="start" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#4c78a8">81%</text>
  <text x="242.0" y="223.0" text-anchor="end" font-size="9" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">23 distinct</text>
  <circle cx="624.8" cy="218.0" r="5.5" fill="#4c78a8"/>
  <text x="634.8" y="222.0" text-anchor="start" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">7.2%</text>
  <line x1="465.0" y1="64" x2="465.0" y2="256.0" stroke="#8b949e" stroke-opacity="0.25" stroke-width="1"/>
</svg>
