<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 286" width="720" height="286" role="img" aria-label="The customer value chain, per customer per month">
  <text x="18.0" y="20.0" text-anchor="start" font-size="13" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">One customer, one month: four answers to what they are worth</text>
  <text x="18.0" y="36.0" text-anchor="start" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">each rung is the one above it, plus or minus something the rung above ignores</text>
  <line x1="190.0" y1="60.0" x2="190.0" y2="258.0" stroke="#8b949e" stroke-opacity="0.18" stroke-width="1"/>
  <text x="190.0" y="272.0" text-anchor="middle" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">0</text>
  <line x1="339.0" y1="60.0" x2="339.0" y2="258.0" stroke="#8b949e" stroke-opacity="0.18" stroke-width="1"/>
  <text x="339.0" y="272.0" text-anchor="middle" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">10</text>
  <line x1="487.9" y1="60.0" x2="487.9" y2="258.0" stroke="#8b949e" stroke-opacity="0.18" stroke-width="1"/>
  <text x="487.9" y="272.0" text-anchor="middle" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">20</text>
  <rect x="190" y="68.0" width="370.3" height="22" fill="#4c78a8" fill-opacity="0.78"/>
  <text x="180.0" y="80.0" text-anchor="end" font-size="11" font-weight="bold" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">product fee</text>
  <text x="180.0" y="94.0" text-anchor="end" font-size="9" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e" fill-opacity="0.85">what the customer signed</text>
  <text x="568.3" y="84.0" text-anchor="start" font-size="11" font-weight="bold" font-family="ui-sans-serif,system-ui,sans-serif" fill="#4c78a8">24.86</text>
  <rect x="190" y="114.0" width="392.5" height="22" fill="#9a6fb0" fill-opacity="0.78"/>
  <text x="180.0" y="126.0" text-anchor="end" font-size="11" font-weight="bold" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">billed ARPU</text>
  <text x="180.0" y="140.0" text-anchor="end" font-size="9" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e" fill-opacity="0.85">plus the non-fee part of the invoice</text>
  <text x="590.5" y="130.0" text-anchor="start" font-size="11" font-weight="bold" font-family="ui-sans-serif,system-ui,sans-serif" fill="#9a6fb0">26.35</text>
  <text x="688.0" y="130.0" text-anchor="end" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#54a24b">+1.49</text>
  <rect x="190" y="160.0" width="379.7" height="22" fill="#9a6fb0" fill-opacity="0.78"/>
  <text x="180.0" y="172.0" text-anchor="end" font-size="11" font-weight="bold" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">collected ARPU</text>
  <text x="180.0" y="186.0" text-anchor="end" font-size="9" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e" fill-opacity="0.85">minus what was never paid</text>
  <text x="577.7" y="176.0" text-anchor="start" font-size="11" font-weight="bold" font-family="ui-sans-serif,system-ui,sans-serif" fill="#9a6fb0">25.49</text>
  <text x="688.0" y="176.0" text-anchor="end" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#e45756">-0.85</text>
  <rect x="190" y="206.0" width="266.9" height="22" fill="#54a24b" fill-opacity="0.78"/>
  <text x="180.0" y="218.0" text-anchor="end" font-size="11" font-weight="bold" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e">contribution</text>
  <text x="180.0" y="232.0" text-anchor="end" font-size="9" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e" fill-opacity="0.85">minus the cost of serving them</text>
  <text x="464.9" y="222.0" text-anchor="start" font-size="11" font-weight="bold" font-family="ui-sans-serif,system-ui,sans-serif" fill="#54a24b">17.92</text>
  <text x="688.0" y="222.0" text-anchor="end" font-size="10" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#e45756">-7.57</text>
  <text x="688.0" y="56.0" text-anchor="end" font-size="9" font-weight="normal" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8b949e" fill-opacity="0.85">vs the rung above</text>
  <line x1="190" y1="60.0" x2="190" y2="258.0" stroke="#8b949e" stroke-opacity="0.55" stroke-width="1.2"/>
</svg>
