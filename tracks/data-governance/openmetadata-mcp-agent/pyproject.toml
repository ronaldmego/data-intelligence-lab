[project]
name = "openmetadata-mcp-agent"
version = "1.0.0"
description = "Conversational AI assistant for OpenMetadata data catalogs"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise from in except clauses
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]          # load_dotenv must run before imports
"scripts/*.py" = ["E402"]    # same pattern in test scripts
