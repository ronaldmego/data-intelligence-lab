name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # El baseline del monorepo es de CORRECCIÓN, no de estilo (ver
      # pyproject.toml): los snapshots archivados se conservan como se
      # archivaron y no se reescriben para complacer al linter de hoy.
      - name: Ruff
        run: uvx ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Convención: una suite de verdad vive en `tracks/<track>/<proyecto>/tests/`.
      #
      # Deliberadamente NO se colecta cualquier `test_*.py` suelto: varios
      # proyectos traen scripts de integración manual bajo `scripts/`
      # (`test_queries.py`, `test_load.py`) que exigen un catálogo vivo, una base
      # de datos y credenciales. Correrlos en CI no prueba nada — solo falla por
      # ImportError y entrena a todos a ignorar el rojo.
      #
      # Hoy no existe ninguna suite: es un gap declarado en el README, no
      # disimulado con un badge verde. Este job se activa solo en cuanto aparezca
      # el primer directorio `tests/`.
      - name: Discover test suites
        id: discover
        run: |
          suites=$(find tracks -type d -name tests -not -path '*/node_modules/*' | tr '\n' ' ')
          if [ -n "$suites" ]; then
            echo "suites=$suites" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No tests/ directory in any track yet — skipping pytest."
          fi

      - name: Pytest
        if: steps.discover.outputs.suites != ''
        run: uvx pytest ${{ steps.discover.outputs.suites }} -q
